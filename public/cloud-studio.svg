<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cloud background -->
  <ellipse cx="32" cy="45" rx="28" ry="15" fill="url(#cloudGradient)" opacity="0.8"/>
  <circle cx="20" cy="40" r="8" fill="url(#cloudGradient)"/>
  <circle cx="32" cy="38" r="10" fill="url(#cloudGradient)"/>
  <circle cx="44" cy="40" r="8" fill="url(#cloudGradient)"/>
  
  <!-- Computer screen -->
  <rect x="18" y="20" width="28" height="20" rx="2" ry="2" fill="url(#screenGradient)" stroke="#1A252F" stroke-width="1"/>
  
  <!-- Screen content (code lines) -->
  <rect x="20" y="23" width="12" height="1.5" fill="#E74C3C" rx="0.5"/>
  <rect x="20" y="26" width="8" height="1.5" fill="#F39C12" rx="0.5"/>
  <rect x="20" y="29" width="16" height="1.5" fill="#27AE60" rx="0.5"/>
  <rect x="20" y="32" width="10" height="1.5" fill="#3498DB" rx="0.5"/>
  <rect x="20" y="35" width="14" height="1.5" fill="#9B59B6" rx="0.5"/>
  
  <!-- Screen stand -->
  <rect x="30" y="40" width="4" height="6" fill="#1A252F"/>
  <rect x="26" y="46" width="12" height="2" fill="#1A252F" rx="1"/>
  
  <!-- Cloud particles -->
  <circle cx="12" cy="25" r="2" fill="#4A90E2" opacity="0.6"/>
  <circle cx="52" cy="28" r="1.5" fill="#4A90E2" opacity="0.6"/>
  <circle cx="8" cy="35" r="1" fill="#4A90E2" opacity="0.4"/>
  <circle cx="56" cy="38" r="1" fill="#4A90E2" opacity="0.4"/>
</svg>